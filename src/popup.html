<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Open Scraper</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/handsontable.full.min.css">
    <link rel="stylesheet" href="design-tokens.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="wait">
        <h1 id="waitHeader">Please wait...</h1>
        <div id="noResponseErr" class="alert alert-danger"></div>
        <img src="../icon128.png" id="wait-spider" style="width: 128px; height: 128px;"/>
    </div>
    <div id="content" class="popup-content-wrapper">
        <div class="popup-content-body">
            <div class="col-xs-5">
                <button type="button" class="btn btn-default btn-block" id="wrongTable">Try another table</button>
                <button type="button" class="btn btn-primary btn-block" id="nextButton">Locate "Next" button</button>
                <div id="savedConfigSection" class="saved-config-section">
                    <div class="saved-config-row">
                        <div class="saved-config-dropdown-wrapper">
                            <select id="savedConfigSelect" class="saved-config-select"></select>
                            <span class="glyphicon glyphicon-chevron-down saved-config-chevron"></span>
                        </div>
                        <button type="button" class="btn btn-primary saved-config-apply" id="applyConfig" data-i18n="popupApply">Apply</button>
                    </div>
                </div>
                <div id="optedOutBanner" class="opted-out-banner" style="display: none;">
                    <span class="glyphicon glyphicon-warning-sign opted-out-banner-icon"></span>
                    <span id="optedOutBannerText" data-i18n="popupAdvancedFeaturesDisabled"></span>
                </div>
                <button type="button" class="btn btn-primary btn-block" id="startScraping">Start crawling</button>
                <button type="button" class="btn btn-default btn-block" id="stopScraping">Stop crawling</button>
                <div id="infinateScrollElement">
                    <input type="checkbox" id="infinateScroll">
                    <label for="infinateScroll" id="infinateScrollLabel">Infinite scroll</label>
                </div>
                <form class="btn-block">
                    <div class="input-group btn-block">
                        <span class="input-group-addon">Min delay</span>
                        <input id="crawlDelay" type="number" value="1" class="form-control"/>
                        <span class="input-group-addon">sec</span>
                    </div>
                    <div class="input-group btn-block">
                        <span class="input-group-addon">Max delay</span>
                        <input id="maxWait" type="number" value="20" class="form-control"/>
                        <span class="input-group-addon">sec</span>
                    </div>
                </form>
            </div>
            <div class="col-xs-3">
                <button type="button" class="btn btn-success download-button btn-block" id="csv">
                    <span class="glyphicon glyphicon-download-alt"></span> CSV
                </button>
                <button type="button" class="btn btn-success download-button btn-block" id="xlsx">
                    <span class="glyphicon glyphicon-download-alt"></span> XLSX
                </button>
                <button type="button" class="btn btn-success download-button btn-block" id="copy">
                    <span class="glyphicon glyphicon-copy"></span> COPY ALL
                </button>
                <button type="button" class="btn btn-warning btn-block" id="resetColumns">Reset columns</button>
            </div>
            <div class="col-xs-4">
                <span id="help" style="color: #777; font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px;">
                    <span class="glyphicon glyphicon-info-sign"></span> Private Local Mode
                </span>
                <div id="stats"></div>
            </div>
            <div class="col-xs-12" id="info">
                <div class="alert alert-danger" id="error"></div>
                <div class="alert alert-success" id="pleaseRate" style="display:none !important;"></div>
                <div class="alert alert-warning" id="inputError"></div>
                <div class="alert alert-warning" id="finished"></div>
                <div class="alert alert-warning" id="previewLimit"></div>
                <div class="alert alert-info" id="instructions"></div>
            </div>
            <div class="col-xs-12">
                <div id="hot" class="hot handsontable htRowHeaders htColumnHeaders"></div>
            </div>
        </div>
        <div class="col-xs-12 popup-footer" style="display: none !important;">
            <div class="popup-footer-links">
                <a href="#" id="footerTermsLink" class="popup-footer-link" data-i18n="popupTerms"></a>
                <span class="popup-footer-separator">|</span>
                <a href="#" id="footerPrivacyLink" class="popup-footer-link" data-i18n="popupPrivacyPolicy"></a>
            </div>
            <button type="button" id="settingsBtn" class="popup-footer-settings-btn" aria-label="Settings">
                <span class="glyphicon glyphicon-cog"></span>
            </button>
        </div>
    </div>

    <script src="../js/papaparse.min.js"></script>
    <script src="../js/jquery-3.1.1.min.js"></script>
    <script src="../js/FileSaver.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/handsontable.full.min.js"></script>
    <script src="../js/xlsx.full.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
